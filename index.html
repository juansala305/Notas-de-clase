<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notas (PDF)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; }
    header { padding: 18px 22px; border-bottom: 1px solid #eee; position: sticky; top: 0; background: white; }
    .wrap { display: grid; grid-template-columns: 320px 1fr; gap: 0; min-height: calc(100vh - 60px); }
    nav { border-right: 1px solid #eee; padding: 14px; overflow: auto; }
    nav a { display: block; padding: 10px 10px; border-radius: 10px; text-decoration: none; color: #111; }
    nav a:hover { background: #f6f6f6; }
    main { padding: 14px; }
    .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .btn { display: inline-block; padding: 10px 12px; border-radius: 12px; border: 1px solid #ddd; text-decoration: none; color: #111; }
    .btn:hover { background: #f6f6f6; }
    iframe { width: 100%; height: calc(100vh - 160px); border: 1px solid #eee; border-radius: 14px; }
    .muted { color: #666; font-size: 14px; }
    @media (max-width: 900px) {
      .wrap { grid-template-columns: 1fr; }
      nav { border-right: none; border-bottom: 1px solid #eee; }
      iframe { height: 70vh; }
    }
  </style>
</head>
<body>
  <header>
    <div style="font-weight:700;">📚 Notas (PDF)</div>
    <div class="muted">Ver en línea y descargar.</div>
  </header>

  <div class="wrap">
    <nav id="list"></nav>

    <main>
      <div class="bar">
        <a id="download" class="btn" href="#" target="_blank" rel="noopener">⬇️ Descargar</a>
        <a id="open" class="btn" href="#" target="_blank" rel="noopener">🔗 Abrir en nueva pestaña</a>
        <span id="label" class="muted"></span>
      </div>
      <iframe id="viewer" src="" title="PDF"></iframe>
    </main>
  </div>

  <script>
    // Lista manual (por ahora). Luego la podemos automatizar.
    const PDFS = [
      { slug: "nota-ejemplo", title: "Nota de ejemplo", file: "pdfs/nota-ejemplo.pdf" },
    ];

    // Luego lo cambiamos por tu Worker real:
    const WORKER_BASE = "https://TU_WORKER_SUBDOMINIO.workers.dev/d/";

    const list = document.getElementById("list");
    const viewer = document.getElementById("viewer");
    const download = document.getElementById("download");
    const open = document.getElementById("open");
    const label = document.getElementById("label");

    function select(pdf) {
      viewer.src = pdf.file;
      open.href = pdf.file;
      download.href = WORKER_BASE + pdf.slug; // descarga trackeada (más adelante)
      label.textContent = pdf.title;
      history.replaceState(null, "", "#" + pdf.slug);
    }

    function renderList() {
      list.innerHTML = PDFS.map(p => `<a href="#${p.slug}" data-slug="${p.slug}">${p.title}</a>`).join("");
      list.querySelectorAll("a").forEach(a => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          const slug = a.getAttribute("data-slug");
          const pdf = PDFS.find(x => x.slug === slug);
          if (pdf) select(pdf);
        });
      });
    }

    renderList();
    const initialSlug = (location.hash || "").replace("#", "");
    const initial = PDFS.find(x => x.slug === initialSlug) || PDFS[0];
    select(initial);
  </script>
</body>
</html>
