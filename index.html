<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notas de clase (PDF)</title>

  <style>
    :root{
      --accent: #d6e4ff;
      --accent-bg: #f1f5ff;
    }

    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; }

    header {
      padding: 18px 22px;
      border-bottom: 1px solid #eee;
      position: sticky; top: 0;
      background: white;
      z-index: 10;
    }

    .wrap { display: grid; grid-template-columns: 340px 1fr; min-height: calc(100vh - 74px); }

    nav { border-right: 1px solid #eee; padding: 14px; overflow: auto; }

    nav a {
      display: block;
      padding: 10px 10px;
      border-radius: 12px;
      text-decoration: none;
      color: #111;
      margin-bottom: 8px;
      border: 1px solid transparent;
      position: relative;
      transition: background .15s ease, border-color .15s ease, transform .05s ease;
    }
    nav a:hover { background: #f6f6f6; }
    nav a:active { transform: translateY(1px); }

    nav a.active {
      background: var(--accent-bg);
      border-color: var(--accent);
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }
    nav a.active::before{
      content:"";
      position:absolute;
      left: 8px;
      top: 8px;
      bottom: 8px;
      width: 6px;
      border-radius: 999px;
      background: var(--accent);
    }
    nav a span.title{
      display:block;
      padding-left: 16px;
    }

    main { padding: 14px; }

    .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
      text-decoration: none;
      color: #111;
      background: white;
    }
    .btn:hover { background: #f6f6f6; }
    .btn .dot{
      width: 10px; height: 10px; border-radius: 999px; background: var(--accent);
      border: 1px solid rgba(0,0,0,0.08);
    }

    iframe { width: 100%; height: calc(100vh - 210px); border: 1px solid #eee; border-radius: 14px; }

    .muted { color: #666; font-size: 14px; }

    .pill {
      display: inline-block;
      font-size: 12px;
      color: #444;
      padding: 4px 10px;
      border: 1px solid #eee;
      border-radius: 999px;
      background: #fafafa;
    }

    @media (max-width: 900px) {
      .wrap { grid-template-columns: 1fr; }
      nav { border-right: none; border-bottom: 1px solid #eee; }
      iframe { height: 70vh; }
    }
  </style>
</head>

<body>
  <header>
    <div style="font-weight:800; font-size: 18px;">📚 Notas de clase</div>
    <div class="muted">
      Ver en línea y descargar PDFs.
      <span class="pill" id="count"></span>
    </div>
  </header>

  <div class="wrap">
    <nav id="list"></nav>

    <main>
      <div class="bar">
        <a id="open" class="btn" href="#" target="_blank" rel="noopener">
          <span class="dot" aria-hidden="true"></span>
          Abrir en nueva pestaña
        </a>

        <a id="feedback" class="btn" href="#" target="_blank" rel="noopener">
          💬 Sugerencias/comentarios/errores
        </a>

        <span id="label" class="muted"></span>
      </div>

      <div class="muted" style="margin: 0 0 10px 2px;">
        ¿Viste un typo o tienes una idea? Déjame una sugerencia (puede ser anónima).
      </div>

      <iframe id="viewer" src="" title="PDF"></iframe>

      <div class="muted" style="margin-top: 10px;">
        Si el visor no carga (a veces pasa en algunos celulares), usa “Abrir en nueva pestaña”.
      </div>
    </main>
  </div>

  <script>
    const COLORS = {
      control:   { accent: "#ff8a3d", bg: "#fff1e7" },
      logistica: { accent: "#f4c430", bg: "#fff8d8" },
      modelos:   { accent: "#3b82f6", bg: "#eaf2ff" },
      simu:      { accent: "#ec4899", bg: "#ffe4f1" },
      ics:       { accent: "#7c3aed", bg: "#f3e8ff" }
    };

    const PDFS = [
      { slug: "ics",                title: "Ingeniería en la Cadena de Suministro (ICS)", materia: "ics", file: "./pdfs/ICS.pdf" },
      { slug: "logistica",          title: "Logística",              materia: "logistica",file: "./pdfs/logistica.pdf" },
      { slug: "modelos-prob-1",     title: "Modelos Probabilísticos — Primer Corte", materia: "modelos", file: "./pdfs/notas_modelos_probabilisticos_primer_corte.pdf" },
      { slug: "control-produccion", title: "Control de Producción", materia: "control",   file: "./pdfs/control_de_produccion.pdf" },
      { slug: "simulacion-eventos", title: "Simulación de Eventos Discretos", materia: "simu", file: "./pdfs/simulacion_de_eventos_discretos.pdf" }
    ];

    const TRACK_BASE = "https://bold-smoke-442f.juanessalamancab.workers.dev";
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSczYFARsjXI6e1Ve4a1Wv1_OcfEI4qaWPzMIZ9nnA_cSivP7A/viewform?usp=header";

    const list = document.getElementById("list");
    const viewer = document.getElementById("viewer");
    const open = document.getElementById("open");
    const label = document.getElementById("label");
    const count = document.getElementById("count");
    const feedback = document.getElementById("feedback");

    count.textContent = `${PDFS.length} PDFs`;

    function applyTheme(materiaKey){
      const c = COLORS[materiaKey] || { accent: "#d6e4ff", bg: "#f1f5ff" };
      document.documentElement.style.setProperty("--accent", c.accent);
      document.documentElement.style.setProperty("--accent-bg", c.bg);
    }

    function setActive(slug) {
      list.querySelectorAll("a").forEach(a => {
        a.classList.toggle("active", a.getAttribute("data-slug") === slug);
      });
    }

    function select(pdf) {
      applyTheme(pdf.materia);
      viewer.src = pdf.file;
      open.href = `${TRACK_BASE}/d/${pdf.slug}?a=open`;
      feedback.href = `${FORM_URL}#pdf=${encodeURIComponent(pdf.slug)}`;
      label.textContent = pdf.title;
      history.replaceState(null, "", "#" + pdf.slug);
      setActive(pdf.slug);
    }

    function renderList() {
      list.innerHTML = PDFS.map(p => {
        return `<a href="#${p.slug}" data-slug="${p.slug}">
                  <span class="title">${p.title}</span>
                </a>`;
      }).join("");

      list.querySelectorAll("a").forEach(a => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          const slug = a.getAttribute("data-slug");
          const pdf = PDFS.find(x => x.slug === slug);
          if (pdf) select(pdf);
        });
      });
    }

    renderList();

    const initialSlug = (location.hash || "").replace("#", "");
    const initial = PDFS.find(x => x.slug === initialSlug) || PDFS[0];
    select(initial);
  </script>

  <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token":"c418a68a49b34c9684dc070e5178fc76"}'></script>
</body>
</html>
